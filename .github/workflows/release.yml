# Publish a GitHub Release whenever a v* tag is pushed. Builds the mod and
# attaches the compiled mod jar (excluding the -sources jar) as a release
# asset using the default GITHUB_TOKEN.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build
        run: chmod +x gradlew && ./gradlew build --no-daemon

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Sources jar is disabled in build.gradle, so build/libs holds exactly
          # the one mod jar — upload it as the release asset.
          files: build/libs/*.jar
          fail_on_unmatched_files: true
