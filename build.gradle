plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Headless server-side GameTest run config.
// Loom registers a Gradle task named `runGametest` from this block (run<CapitalizedName>).
// `server()` sets the dedicated-server main class; `-Dfabric-api.gametest` flips the
// fabric-gametest-api-v1 module into test-runner mode (boot world, run every @GameTest,
// then exit code 0 on all-pass / non-zero on any failure). The report-file property
// also makes it emit a JUnit XML report we can parse.
def gametestReport = "${projectDir}/build/gametest/report.xml"
loom {
	runs {
		gametest {
			server()
			name = "Game Test"
			source sourceSets.main
			runDir "build/gametest/run"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${gametestReport}"
		}
	}
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	// Capture at configuration time; reading project.version inside the
	// filesMatching closure (execution time) is deprecated and fails in Gradle 10.
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	// Disabled so releases ship a single clean mod jar (no -sources artifact).
	// withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Capture the base name at configuration time; reading project.* inside the
// rename closure (which runs at task-execution time) is deprecated and will
// fail in Gradle 10.
def licenseBaseName = project.archives_base_name

jar {
	from("LICENSE") {
		rename { "${it}_${licenseBaseName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
