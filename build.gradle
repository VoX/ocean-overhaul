plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// Headless server-side GameTest run config.
// Loom registers a Gradle task named `runGametest` from this block (run<CapitalizedName>).
// `server()` sets the dedicated-server main class; `-Dfabric-api.gametest` flips the
// fabric-gametest-api-v1 module into test-runner mode (boot world, run every @GameTest,
// then exit code 0 on all-pass / non-zero on any failure). The report-file property
// also makes it emit a JUnit XML report we can parse.
def gametestReport = "${projectDir}/build/gametest/report.xml"

// ---------------------------------------------------------------------------
// DEV-ONLY render-probe source set. This is a SEPARATE source set + a separate
// fabric mod (src/renderprobe/resources/fabric.mod.json, id
// `oceanstarter_renderprobe`) used ONLY to drive a headless dev client and grab
// a real screenshot of the Megalodon (task: runClientProbe). It is deliberately
// kept OUT of the shipped jar: `jar`/`remapJar` only bundle sourceSets.main, and
// nothing in the release flow references the `renderprobe` source set, so the
// release artifact stays clean. It links against main's compiled output.
// ---------------------------------------------------------------------------
sourceSets {
	renderprobe {
		compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
		runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
	}
}

loom {
	runs {
		gametest {
			server()
			name = "Game Test"
			source sourceSets.main
			runDir "build/gametest/run"
			vmArg "-Dfabric-api.gametest"
			vmArg "-Dfabric-api.gametest.report-file=${gametestReport}"
		}
		// Headless render probe: a dev client that joins the local ephemeral
		// server, aims at the pre-summoned Megalodon and screenshots it. Driven
		// by scripts/render-megalodon.sh (Xvfb + llvmpipe). The -Doo.probe.*
		// system props (out path, host/port, target coords) are passed at launch
		// by that script via ORG_GRADLE_PROJECT / -P or appended JVM args.
		clientProbe {
			client()
			name = "Client Render Probe"
			source sourceSets.renderprobe
			runDir "build/clientprobe/run"
			// Forward -Poo.probe.* gradle properties to the client JVM as
			// -Doo.probe.* system props (out path, host/port, target, timeout).
			// Lets scripts/render-megalodon.sh parameterise a run without editing
			// this file. Read at configuration time (safe; values are Strings).
			["out", "host", "port", "target", "targetType", "timeoutTicks"].each { k ->
				def pk = "oo.probe.${k}"
				if (project.hasProperty(pk)) {
					vmArg "-D${pk}=${project.property(pk)}"
				}
			}
		}
	}
	// Register BOTH the main mod and the dev-only probe as loom mods so each is
	// loaded from its own source set with its own fabric.mod.json in dev runs.
	mods {
		register("oceanstarter") {
			sourceSet sourceSets.main
		}
		register("oceanstarter_renderprobe") {
			sourceSet sourceSets.renderprobe
		}
	}
}

// The render probe needs the same Minecraft/Fabric API surface as main at
// compile time. Mirror main's mod dependencies into the renderprobe config.
dependencies {
	renderprobeImplementation sourceSets.main.output
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	// Capture at configuration time; reading project.version inside the
	// filesMatching closure (execution time) is deprecated and fails in Gradle 10.
	def modVersion = project.version
	inputs.property "version", modVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	// Disabled so releases ship a single clean mod jar (no -sources artifact).
	// withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

// Capture the base name at configuration time; reading project.* inside the
// rename closure (which runs at task-execution time) is deprecated and will
// fail in Gradle 10.
def licenseBaseName = project.archives_base_name

jar {
	from("LICENSE") {
		rename { "${it}_${licenseBaseName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
